name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows CI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.98.1
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.98.1
          rustup default 1.98.1

      - name: Show toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Prepare ZIP package
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "latchnott-package"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "latchnott-windows-x86_64.zip"

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $packageDir | Out-Null

          Copy-Item `
            "target\release\latchnott.exe" `
            (Join-Path $packageDir "latchnott.exe")

          if (Test-Path "configuration.toml.example") {
            Copy-Item `
              "configuration.toml.example" `
              (Join-Path $packageDir "configuration.toml.example")
          }

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive `
            -Path (Join-Path $packageDir "*") `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: latchnott-windows-x86_64
          path: latchnott-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
